[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-api-python-client"
version = "2.108.0"
description = "Vendored copy of google-api-python-client 2.108.0 with the unused static discovery-document cache (googleapiclient/discovery_cache/documents/) stripped out."
requires-python = ">=3.7"
license = { file = "LICENSE" }
dependencies = [
  "httplib2>=0.15.0,<1.dev0",
  "google-auth>=1.19.0,<3.0.0.dev0",
  "google-auth-httplib2>=0.1.0",
  "google-api-core>=1.31.5,<3.0.0.dev0,!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.0",
  "uritemplate>=3.0.1,<5",
]

[tool.setuptools]
packages = ["googleapiclient", "googleapiclient.discovery_cache", "apiclient"]
